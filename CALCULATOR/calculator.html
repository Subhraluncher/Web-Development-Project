<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <div class="calculator">
        <input type="text" placeholder="0" id="display">

        <div>
            <button onclick="ClearDisplay()" class="operator"> AC </button>
            <button onclick="DeletToDisplay()" class="operator"> DEL </button>
            <button onclick="OpendToDisplay" class="operator"> % </button>
            <button onclick="OpendToDisplay('/')" class="operator"> / </button>
        </div>
        <div>
            <button onclick="OpendToDisplay('7')"> 7 </button>
            <button onclick="OpendToDisplay('8')"> 8 </button>
            <button onclick="OpendToDisplay('9')"> 9 </button>
            <button onclick="OpendToDisplay('*')" class="operator"> * </button>
        </div>
        <div>
            <button onclick="OpendToDisplay('4')"> 4 </button>
            <button onclick="OpendToDisplay('5')"> 5 </button>
            <button onclick="OpendToDisplay('6')"> 6 </button>
            <button onclick="OpendToDisplay('-')" class="operator"> - </button>
        </div>
        <div>
            <button onclick="OpendToDisplay('1')"> 1 </button>
            <button onclick="OpendToDisplay('2')"> 2 </button>
            <button onclick="OpendToDisplay('3')"> 3 </button>
            <button onclick="OpendToDisplay('+')" class="operator"> + </button>
        </div>
        <div>
            <button onclick="OpendToDisplay('00')"> 00 </button>
            <button onclick="OpendToDisplay('0')"> 0 </button>
            <button onclick="OpendToDisplay('.')"> . </button>
            <button onclick="CalculateResult('=')" class="equalBtn"> = </button>
        </div>

    </div> 
    <script src="calculator.js"></script>
    
</body>
</html>
